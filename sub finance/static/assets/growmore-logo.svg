<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Growmore Icon: Modern Ascending Growth Bars with Upward Arrow -->
  <defs>
    <linearGradient id="gmGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="gmArrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(6, 6)">
    <!-- Rounded Background Container -->
    <rect width="48" height="48" rx="12" fill="#0f172a" />
    
    <!-- Growth Bars -->
    <rect x="12" y="28" width="5" height="12" rx="2" fill="#10b981" opacity="0.6" />
    <rect x="20" y="21" width="5" height="19" rx="2" fill="#10b981" opacity="0.85" />
    <rect x="28" y="14" width="5" height="26" rx="2" fill="url(#gmGrad)" />
    
    <!-- Dynamic Arrow Curve -->
    <path d="M12 25 L22 15 L32 10 L38 10 M38 10 L33 7 M38 10 L33 14" stroke="url(#gmArrow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Logo Typography -->
  <!-- "GROWMORE" -->
  <text x="66" y="33" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" letter-spacing="-0.5" fill="#0f172a">
    GROW<tspan fill="#059669">MORE</tspan>
  </text>
  <!-- Subtitle: "IPO & WEALTH" -->
  <text x="67" y="47" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="9.5" letter-spacing="2.5" fill="#64748b">
    IPO GMP TRACKER
  </text>
</svg>
